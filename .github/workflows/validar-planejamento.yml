name: validar-planejamento-v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planejamento:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CaixaFuturo
        uses: actions/checkout@v4
      - name: Checkout skill 2.0 oficial
        uses: actions/checkout@v4
        with:
          repository: devandrelima/planejamento-de-sistemas
          ref: 76c187894d15ff2ecd744a25cc195feb68d72b0d
          path: _planejamento_skill
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar plano
        run: python3 _planejamento_skill/skills/planejamento-de-sistemas/scripts/fluxo.py --repo . validar
      - name: Conferir tokens, contraste e contextos da UI
        run: python3 tools/validar_design.py
      - name: Validar fronteiras entre tasks e pendência da S02
        run: python3 tools/validar_fronteiras_tasks.py
      - name: Mostrar tasks prontas
        run: python3 _planejamento_skill/skills/planejamento-de-sistemas/scripts/fluxo.py --repo . prontas
      - name: Verificar carregamento seletivo de uma task liberada
        run: |
          FLUXO=_planejamento_skill/skills/planejamento-de-sistemas/scripts/fluxo.py
          TASK=$(python3 $FLUXO --repo . prontas | python3 -c "import json,sys; r=json.load(sys.stdin)['ready']; print(r[0] if r else '')")
          if [ -z "$TASK" ]; then
            echo "Nenhuma task liberada (sprint aguardando avaliação humana ou projeto aprovado)."
          else
            python3 $FLUXO --repo . contexto "$TASK" --saida /tmp/caixafuturo-task.md
          fi
