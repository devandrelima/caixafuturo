# CaixaFuturo — Nginx para SPA estática (porta interna 8080, sem root).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Cabeçalhos de segurança (valem para todas as respostas; locations abaixo não usam add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Verificação de saúde (usada pelo HEALTHCHECK do contêiner).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Commit implantado.
    location = /version.txt {
        default_type text/plain;
        expires epoch;
        try_files $uri =404;
    }

    # Arquivos com hash no nome: cache longo.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html nunca em cache, para que o recarregamento traga a versão nova.
    location = /index.html {
        expires epoch;
    }

    # Arquivos estáticos inexistentes retornam 404 (não caem no fallback da SPA).
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|json|txt|webmanifest)$ {
        try_files $uri =404;
    }

    # Fallback da SPA: rotas profundas devolvem index.html.
    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
