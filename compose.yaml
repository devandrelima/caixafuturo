# CaixaFuturo — um único serviço estático. Não exige chaves, banco ou credenciais.
# Porta pública do host: CAIXAFUTURO_PORT (padrão 8084; a 8080 é usada pelo code-server nesta VPS).
name: caixafuturo

services:
  caixafuturo:
    image: caixafuturo:${CAIXAFUTURO_TAG:-latest}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-desconhecido}
    container_name: caixafuturo
    ports:
      - "${CAIXAFUTURO_PORT:-8084}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
